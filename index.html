
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculator</title>

<style>
    body{
        margin:0;
        height:90vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#0f1720;
        font-family:Arial, sans-serif;
    }

    .calculator{
        width:300px;
        background:linear-gradient(145deg,#1e293b,#0f172a);
        padding:20px;
        border-radius:20px;
        box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }

    .display{
        height:80px;
        background:#111827;
        border-radius:15px;
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:flex-end;
        font-size:2rem;
        padding:10px;
        margin-bottom:15px;
        overflow:hidden;
    }

    .buttons{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:10px;
    }

    button{
        height:60px;
        border:none;
        border-radius:50%;
        font-size:1.2rem;
        cursor:pointer;
        transition:0.2s;
    }

    button:active{
        transform:scale(0.95);
    }

    .btn-gray{
        background:#1f2937;
        color:#fff;
    }

    .btn-orange{
        background:#f97316;
        color:#fff;
    }

    .btn-wide{
        border-radius:500px;
    }

    .zero{
        grid-column:span 2;
        border-radius:500px;
    }
</style>
</head>

<body>

<div class="calculator">

    <div class="display" id="display">Ishimwe David</div>

    <div class="buttons">

        <button class="btn-orange" onclick="clearDisplay()">AC</button>
        <button class="btn-orange" onclick="deleteLast()">DEL</button>
        <button class="btn-orange" onclick="appendValue('%')">%</button>
        <button class="btn-orange" onclick="appendValue('/')">/</button>

        <button class="btn-gray" onclick="appendValue('7')">7</button>
        <button class="btn-gray" onclick="appendValue('8')">8</button>
        <button class="btn-gray" onclick="appendValue('9')">9</button>
        <button class="btn-orange" onclick="appendValue('*')">*</button>

        <button class="btn-gray" onclick="appendValue('4')">4</button>
        <button class="btn-gray" onclick="appendValue('5')">5</button>
        <button class="btn-gray" onclick="appendValue('6')">6</button>
        <button class="btn-orange" onclick="appendValue('-')">-</button>

        <button class="btn-gray" onclick="appendValue('1')">1</button>
        <button class="btn-gray" onclick="appendValue('2')">2</button>
        <button class="btn-gray" onclick="appendValue('3')">3</button>
        <button class="btn-orange" onclick="appendValue('+')">+</button>

        <button class="btn-gray zero" onclick="appendValue('00')">00</button>
        <button class="btn-gray" onclick="appendValue('0')">0</button>
        <button class="btn-gray" onclick="appendValue('.')">.</button>
        <button class="btn-orange" onclick="calculate()">=</button>

    </div>
</div>

<script>
const display = document.getElementById('display');

let isInitial = true;
let justCalculated = false;

function appendValue(value){

    if(isInitial || justCalculated || display.innerText === 'Error'){
        display.innerText = value;
        isInitial = false;
        justCalculated = false;
    } 
    else {
        display.innerText += value;
    }
}

function clearDisplay(){
    display.innerText = '0';
    isInitial = false;
    justCalculated = false;
}

function deleteLast(){

    if(isInitial || justCalculated || display.innerText === 'Error'){
        display.innerText = '0';
        isInitial = false;
        justCalculated = false;
        return;
    }

    if(display.innerText.length <= 1){
        display.innerText = '0';
    } 
    else {
        display.innerText = display.innerText.slice(0,-1);
    }
}

function calculate(){

    try{

        let expression = display.innerText;

        if(!/^[0-9+\-*/%.() ]+$/.test(expression)){
            display.innerText = 'Error';
            justCalculated = true;
            return;
        }

        let result = eval(expression);

        if(!Number.isFinite(result)){
            display.innerText = 'Error';
        } 
        else {
            display.innerText = result;
        }

        justCalculated = true;
        isInitial = false;

    } 
    catch(error){
        display.innerText = 'Error';
        justCalculated = true;
    }
}
</script>

</body>
</html>
